    <title>Praman Dashboard: Live Telemetry Sketch</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = null;
          try {
            if (window.parent && window.parent !== window && window.parent.document && window.parent.document.documentElement) {
              var pt = window.parent.document.documentElement.dataset.theme;
              if (pt === "dark" || pt === "light") t = pt;
            }
          } catch (e) {}
          if (t !== "dark" && t !== "light") {
            var stored = localStorage.getItem("praman-theme");
            if (stored === "dark" || stored === "light") t = stored;
          }
          if (t !== "dark" && t !== "light") {
            var p = new URLSearchParams(location.search).get("theme");
            if (p === "dark" || p === "light") t = p;
          }
          if (t !== "dark" && t !== "light") {
            t = "light";
          }
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="color-scheme"]');
          if (m) m.setAttribute("content", t);
          if (localStorage.getItem("praman-motion") === "reduced") {
            document.documentElement.dataset.motion = "reduced";
          }
        } catch (e) {}
      })();
    </script>
