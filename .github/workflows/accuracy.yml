name: Praman Daily Accuracy & Live Endpoint Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  verify-praman-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --omit=optional || npm install --no-audit

      - name: Run 651B WASM Comparator Verification (1043 cases)
        run: npm run comparator:test

      - name: Run MCP 29-Tool Protocol Suite
        run: npm run mcp:test

      - name: Run SDK & Solana Spend Guard Suite (JS + Devnet + Python)
        run: npm run sdk:test

      - name: Run ByteDance #5 Creative QA & Virtuals ACP v2 Suites
        run: |
          npm run bytedance:demo
          npm run acp:test

      - name: Run Adversarial Endpoint & Chrysolite Regression Suite
        run: node scripts/test-endpoints-local.mjs

      - name: Probe Live Production Endpoints (https://praman-desk.vercel.app)
        run: |
          node -e '
            const assert = require("node:assert/strict");
            (async () => {
              const base = "https://praman-desk.vercel.app";
              const health = await fetch(base + "/api/health").then(r => r.json());
              assert.equal(health.ok, true, "health.ok");
              const biz = await fetch(base + "/api/business").then(r => r.json());
              assert.equal(biz.minerId, 6164, "biz.minerId");
              const sg = await fetch(base + "/api/spend-guard/evaluate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ vendorName: "Siemens Aktiengesellschaft", spendAmountUsdc: 450, liveSettle: false })
              }).then(r => r.json());
              assert.equal(sg.vendorVerification?.lei, "W38RGI023J3WT1HWRP32", "Siemens LEI");
              const sanc = await fetch(base + "/api/miner/sanctions-screen?name=Viktor%20But").then(r => r.json());
              assert.equal(sanc.verdict, "NEAR_MISS_REVIEW", "Viktor But near-miss verdict");
              const liq = await fetch(base + "/api/miner/liquidity-depth?pair=ARB/USDC&chain=arbitrum").then(r => r.json());
              assert.equal(liq.status, "confirmed", "ARB/USDC liquidity depth confirmed");
              const hf = await fetch("https://karadakash1-praman-sanctions-evaluator.hf.space/health").then(r => r.json());
              assert.equal(hf.ok, true, "HF Space /health ok");
              assert.equal(hf.ready, true, "HF Space adapterexec ready");
              console.log("All live production + Track 3 evaluator checks passed!");
            })().catch(e => { console.error(e); process.exit(1); });
          '
