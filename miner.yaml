  - path: /api/miner/fraud-risk
    external_path: /api/miner/fraud-risk
    method: GET
    intents:
      - FRAUD_RISK_GENERAL
    description: >-
      Computes forward-looking fraud probability (0.00-1.00) and risk level from actor context: IP/ASN RDAP reputation, disposable email, headless browser fingerprint, phishing domain, and OFAC SDN signals.
    params:
      query:
        optional:
          - name: subject
            type: string
            intents: ["*"]
            description: "Entity, payment, email, IP, or account context to assess"
          - name: ip
            type: string
            intents: ["*"]
            description: "Client IP address"
          - name: email
            type: string
            intents: ["*"]
            description: "Actor email address"
          - name: user_agent
            type: string
            intents: ["*"]
            description: "HTTP User-Agent string"
          - name: fingerprint
            type: string
            intents: ["*"]
            description: "Browser/session fingerprint context"
          - name: question
            type: string
            intents: ["*"]
            description: "Verbatim fraud risk scoring query"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Evaluation prompt string"

  - path: /api/miner/payment-method-verify
    external_path: /api/miner/payment-method-verify
    method: GET
    intents:
