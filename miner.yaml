          - name: routing_number
            type: string
            intents: ["*"]
            description: "9-digit US ABA routing number"
          - name: iban
            type: string
            intents: ["*"]
            description: "International Bank Account Number"
          - name: question
            type: string
            intents: ["*"]
            description: "Verbatim payment method verification query"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Evaluation prompt string"

  - path: /api/miner/arbitrate
    external_path: /api/miner/arbitrate
    method: POST
    intents:
      - MULTI_MINER_DISCREPANCY_ARBITRATION
    description: >-
      Meta-arbitration engine comparing multi-miner verdicts, measuring basis-point tolerance variance, and issuing cryptographic consensus receipts.
