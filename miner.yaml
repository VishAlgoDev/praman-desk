          - name: email
            type: string
            intents: ["*"]
            description: "Work email address"
          - name: company
            type: string
            intents: ["*"]
            description: "Legal company or brand name"
          - name: question
            type: string
            intents: ["*"]
            description: "Verbatim enrichment query"
          - name: prompt
