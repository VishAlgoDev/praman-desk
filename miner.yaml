version: "1"
kind: miner
id: 6128 # Sepolia Diamond Registration #6128 (Devnode Engine Route #5281)
slug: praman-compliance-miner
protocol: generic
name: Praman Desk Compliance & Procurement Auditor
description: >-
  Autonomous compliance auditor, 3-way invoice vs ledger reconciliation,
  procurement purchase order verification, statutory entity checks via GLEIF,
  cryptographic SHA-256 e-Invoice provenance verification, global corporate
  registry lookups across 200+ jurisdictions, US Treasury OFAC sanctions
  screening with fuzzy alias matching, and SEC EDGAR / Federal Register
  regulatory filing monitoring. Deterministic ground-truth guarantees without API keys.
base_url: https://praman-desk.vercel.app

auth:
  type: none

endpoints:
  - path: /api/miner/po-verify
    external_path: /api/miner/po-verify
    method: GET
    intents:
      - PURCHASE_ORDER_VERIFY_GENERAL
    description: >-
      Verifies purchase order arithmetic and line totals. Checks line_total = quantity * unit_price,
      sum of lines = subtotal, and subtotal + tax + shipping = grand_total.
      Accepts canonical parameters (po_number, vendor, items) or verbatim question string (?question=...).
    params:
      query:
        optional:
          - name: po_number
            type: string
            intents: ["*"]
            description: "Purchase order identifier"
          - name: vendor
            type: string
            intents: ["*"]
            description: "Vendor entity name"
          - name: question
            type: string
            intents: ["*"]
            description: "Full verbatim purchase order text or audit query"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: purchase_order
            type: string
            intents: ["*"]
            description: "Full purchase order text or identifier"
          - name: po
            type: string
            intents: ["*"]
            description: "Purchase order alias"
          - name: text
            type: string
            intents: ["*"]
            description: "Purchase order text"

  - path: /api/miner/invoice-reconcile
    external_path: /api/miner/invoice-reconcile
    method: GET
    intents:
      - INVOICE_LEDGER_RECONCILE_GENERAL
    description: >-
      Performs 3-way invoice vs ledger reconciliation. Identifies mathematical discrepancies,
      tax rate mismatches, unit price variances, and currency conversion adjustments.
      Returns boolean reconciled status, numerical discrepancy amount, and detailed findings.
    params:
      query:
        optional:
          - name: invoice
            type: string
            intents: ["*"]
            description: "Invoice identifier, amount, or payload"
          - name: ledger
            type: string
            intents: ["*"]
            description: "ERP ledger entry or general ledger reference"
          - name: question
            type: string
            intents: ["*"]
            description: "Verbatim reconciliation problem text"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"

  - path: /api/miner/vendor-verify
    external_path: /api/miner/vendor-verify
    method: GET
    intents:
      - VENDOR_VERIFY_GENERAL
    description: >-
      Verifies vendor corporate existence, active statutory status, and LEI registration
      against the Global Legal Entity Identifier Foundation (GLEIF) primary registry.
      Returns boolean valid status, legal name, jurisdiction, and official registrar link.
    params:
      query:
        optional:
          - name: vendor
            type: string
            intents: ["*"]
            description: "Legal company name or business trading name"
          - name: vat_number
            type: string
            intents: ["*"]
            description: "VAT, EIN, GSTIN, or LEI tax identifier"
          - name: lei
            type: string
            intents: ["*"]
            description: "20-character ISO 17442 Legal Entity Identifier"
          - name: question
            type: string
            intents: ["*"]
            description: "Vendor inquiry question"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"

  - path: /api/miner/doc-authenticity
    external_path: /api/miner/doc-authenticity
    method: GET
    intents:
      - DOCUMENT_AUTHENTICITY_GENERAL
    description: >-
      Verifies document provenance, e-Invoice canonical representation, and SHA-256 cryptographic digest.
      Confirms integrity of digital invoices, bills of lading, and procurement receipts.
    params:
      query:
        optional:
          - name: document
            type: string
            intents: ["*"]
            description: "Document body, e-invoice text, or SHA-256 hash"
          - name: hash
            type: string
            intents: ["*"]
            description: "Expected SHA-256 cryptographic digest"
          - name: question
            type: string
            intents: ["*"]
            description: "Document verification inquiry"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"

  # --- NEW COMPLIANCE INTENTS (H2 EXPANSION) ---

  - path: /api/miner/corporate-registry
    external_path: /api/miner/corporate-registry
    method: GET
    intents:
      - CORPORATE_REGISTRY_LOOKUP_GENERAL
    description: >-
      Looks up corporate registry records for a legal entity via GLEIF Global LEI Index
      and UK Companies House public registry fallback. Accepts structured parameters or
      natural-language questions (?question=/query=). Returns company legal name, LEI or
      company number, active status (status_active 1 or 0), jurisdiction, registered
      address, and official source URLs across 200+ jurisdictions worldwide.
    params:
      query:
        optional:
          - name: name
            type: string
            intents: ["*"]
            description: "Legal entity name to search (also accepted as company, entity, legal_name)"
          - name: company
            type: string
            intents: ["*"]
            description: "Alias for name"
          - name: jurisdiction
            type: string
            intents: ["*"]
            description: "ISO 3166-1 alpha-2 country code (e.g., US, GB, DE)"
          - name: question
            type: string
            intents: ["*"]
            description: "Corporate registry inquiry"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"

  - path: /api/miner/sanctions-screen
    external_path: /api/miner/sanctions-screen
    method: GET
    intents:
      - SANCTIONS_SCREENING_MATCH_GENERAL
    description: >-
      Screens a person or entity name against the US Treasury OFAC SDN
      (Specially Designated Nationals) sanctions list with fuzzy matching
      against primary names and known aliases. Returns match details,
      similarity scores, and associated sanctions programs. List is cached
      and refreshed every 6 hours from official OFAC data.
    params:
      query:
        optional:
          - name: name
            type: string
            intents: ["*"]
            description: "Person or entity name to screen (required)"
          - name: question
            type: string
            intents: ["*"]
            description: "Sanctions screening inquiry"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"

  - path: /api/miner/regulatory-filing
    external_path: /api/miner/regulatory-filing
    method: GET
    intents:
      - REGULATORY_FILING_MONITOR_GENERAL
    description: >-
      Monitors regulatory filing status for legal entities using authoritative keyless
      sources: SEC EDGAR Submissions API (CIK-resolved company filings for 10-K, 10-Q,
      8-K) with EFTS full-text search fallback; US Federal Register API for agency notices
      and rules; and GLEIF for LEI registration status and renewal dates. Supports both
      structured parameters and natural-language questions (?question=/query=).
    params:
      query:
        optional:
          - name: entity
            type: string
            intents: ["*"]
            description: "Legal entity or company name to check filings for"
          - name: company
            type: string
            intents: ["*"]
            description: "Alias for entity"
          - name: period
            type: string
            intents: ["*"]
            description: "Filing period filter (e.g., 2026, Q3 2026)"
          - name: question
            type: string
            intents: ["*"]
            description: "Regulatory filing inquiry"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: filter[entity.legalName]
            type: string
            intents: ["*"]
            description: "GLEIF standard filter for entity legal name"
          - name: filter[entity.lei]
            type: string
            intents: ["*"]
            description: "GLEIF standard filter for entity LEI"

  - path: /api/miner/contract-obligation
    external_path: /api/miner/contract-obligation
    method: GET
    intents:
      - CONTRACT_OBLIGATION_AUDIT_GENERAL
    description: >-
      Audits contractual and statutory obligations across standard procurement, construction,
      and commercial real estate regimes (MahaRERA delay interest under Section 18(1), FIDIC Sub-Clause 20.1
      EOT time-bars & Sub-Clause 8.7 LDs, MEP turnkey retention releases, MSMED Act 2006 statutory
      overrides of pay-when-paid clauses, commercial lease CAM caps, and civil works price escalation).
      Accepts canonical parameters or verbatim natural-language audit prompts (?question=...).
    params:
      query:
        optional:
          - name: question
            type: string
            intents: ["*"]
            description: "Full verbatim contract obligation audit query"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: contract
            type: string
            intents: ["*"]
            description: "Contract identifier or reference"
          - name: clause
            type: string
            intents: ["*"]
            description: "Clause or sub-clause under audit"
  - path: /api/miner/mining-intelligence
    external_path: /api/miner/mining-intelligence
    method: GET
    intents:
      - MINING_INTELLIGENCE_GENERAL
    description: >-
      Deep historical mining & geological intelligence across GSQ, GSWA, USGS, CGS, GSI, and NRCan
      open survey records. Returns verified deposit metrics, jurisdiction, provenance, and confidence.
      Accepts mine name, site, or natural-language query (?question=...).
    params:
      query:
        optional:
          - name: site
            type: string
            intents: ["*"]
            description: "Mine name, goldfield, or deposit identifier"
          - name: mine
            type: string
            intents: ["*"]
            description: "Alias for site"
          - name: question
            type: string
            intents: ["*"]
            description: "Full verbatim mining intelligence query"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"

  - path: /api/miner/grid-power-price
    external_path: /api/miner/grid-power-price
    method: GET
    intents:
      - GRID_POWER_PRICE_GENERAL
    description: >-
      Provides authoritative wholesale grid power pricing, Locational Marginal Pricing (LMP),
      and settlement point prices for CAISO (NP15, SP15, ZP26) and ERCOT (North, South, West, Houston).
      Accepts canonical parameters (hub, iso, market) or natural-language query (?question=...).
    params:
      query:
        optional:
          - name: hub
            type: string
            intents: ["*"]
            description: "Grid pricing hub or settlement node (e.g. NP15, SP15, ERCOT North, Houston)"
          - name: iso
            type: string
            intents: ["*"]
            description: "Independent System Operator or RTO (CAISO, ERCOT, NYISO)"
          - name: market
            type: string
            intents: ["*"]
            description: "Market interval: RTM (Real-Time Market) or DAM (Day-Ahead Market)"
          - name: question
            type: string
            intents: ["*"]
            description: "Full verbatim power price query string"

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - PURCHASE_ORDER_VERIFY_GENERAL
    - INVOICE_LEDGER_RECONCILE_GENERAL
    - VENDOR_VERIFY_GENERAL
    - DOCUMENT_AUTHENTICITY_GENERAL
    - CORPORATE_REGISTRY_LOOKUP_GENERAL
    - SANCTIONS_SCREENING_MATCH_GENERAL
    - REGULATORY_FILING_MONITOR_GENERAL
    - CONTRACT_OBLIGATION_AUDIT_GENERAL
    - GRID_POWER_PRICE_GENERAL
    - MINING_INTELLIGENCE_GENERAL

docs:
  repository: https://github.com/VishAlgoDev/praman-desk

rate_limit_per_sec: 20
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30
