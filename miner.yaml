version: "1"
kind: miner
id: 6164 # Devnode Miner #6164 / Sepolia Diamond Port Registration
slug: praman-compliance-miner
protocol: generic
name: Praman Desk Sovereign Compliance & Spend Guard Miner
description: >-
  Deterministic B2B spend guard, invoice/PO reconciliation, KYB/GLEIF entity
  verification, US Treasury OFAC SDN screening (19,629 records), SEC/Federal
  Register monitoring, multi-chain token/liquidity/TX forensics, TLS/CVE/threat
  intelligence, maritime shipment delay modeling, and WASM contract auditing
  without paid API keys. Fails closed with confidence 0.0 when an upstream feed
  is unreachable. Standard response keys: verdict, confidence, summary, as_of.
base_url: https://praman-desk.vercel.app

auth:
  type: none

endpoints:
  - path: /api/miner/po-verify
    external_path: /api/miner/po-verify
    method: GET
    intents:
      - PURCHASE_ORDER_VERIFY_GENERAL
    description: >-
      Verifies purchase order arithmetic and line totals. Checks line_total = quantity * unit_price,
      sum of lines = subtotal, and subtotal + tax + shipping = grand_total.
      Accepts canonical parameters (po_number, vendor, items) or verbatim question string (?question=...).
    params:
      query:
        optional:
          - name: po_number
            type: string
            intents: ["*"]
            description: "Purchase order identifier"
          - name: vendor
            type: string
            intents: ["*"]
            description: "Vendor entity name"
          - name: question
            type: string
            intents: ["*"]
            description: "Full verbatim purchase order text or audit query"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim evaluation prompt string"
          - name: purchase_order
            type: string
            intents: ["*"]
            description: "Full purchase order text or identifier"
          - name: po
            type: string
            intents: ["*"]
            description: "Purchase order alias"
          - name: text
            type: string
            intents: ["*"]
            description: "Purchase order text"

  - path: /api/miner/invoice-reconcile
    external_path: /api/miner/invoice-reconcile
    method: GET
    intents:
      - INVOICE_LEDGER_RECONCILE_GENERAL
    description: >-
      Performs 3-way invoice vs ledger reconciliation. Identifies mathematical discrepancies,
      tax rate mismatches, unit price variances, and currency conversion adjustments.
      Returns boolean reconciled status, numerical discrepancy amount, and detailed findings.
    params:
      query:
        optional:
          - name: invoice
            type: string
            intents: ["*"]
            description: "Invoice identifier, amount, or payload"
          - name: ledger
            type: string
            intents: ["*"]
            description: "ERP ledger entry or general ledger reference"
          - name: question
            type: string
            intents: ["*"]
            description: "Verbatim reconciliation problem text"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim evaluation prompt string"

  - path: /api/miner/vendor-verify
    external_path: /api/miner/vendor-verify
    method: GET
    intents:
      - VENDOR_VERIFY_GENERAL
    description: >-
      Verifies vendor corporate existence, active statutory status, and LEI registration
      against the Global Legal Entity Identifier Foundation (GLEIF) primary registry.
      Returns boolean valid status, legal name, jurisdiction, and official registrar link.
    params:
      query:
        optional:
          - name: vendor
            type: string
            intents: ["*"]
            description: "Legal company name or business trading name"
          - name: name
            type: string
            intents: ["*"]
            description: "Vendor entity name alias"
          - name: company
            type: string
            intents: ["*"]
            description: "Company name alias"
          - name: vat_number
            type: string
            intents: ["*"]
            description: "VAT, EIN, GSTIN, or LEI tax identifier"
          - name: tax_id
            type: string
            intents: ["*"]
            description: "Tax identifier or VAT alias"
          - name: lei
            type: string
            intents: ["*"]
            description: "20-character ISO 17442 Legal Entity Identifier"
          - name: question
            type: string
            intents: ["*"]
            description: "Vendor inquiry question"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim evaluation prompt string"

  - path: /api/miner/doc-authenticity
    external_path: /api/miner/doc-authenticity
    method: GET
    intents:
      - DOCUMENT_AUTHENTICITY_GENERAL
    description: >-
      Verifies document provenance, e-Invoice canonical representation, and SHA-256 cryptographic digest.
      Confirms integrity of digital invoices, bills of lading, and procurement receipts.
    params:
      query:
        optional:
          - name: document
            type: string
            intents: ["*"]
            description: "Document body, e-invoice text, or SHA-256 hash"
          - name: hash
            type: string
            intents: ["*"]
            description: "Expected SHA-256 cryptographic digest"
          - name: question
            type: string
            intents: ["*"]
            description: "Document verification inquiry"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim evaluation prompt string"

  # --- NEW COMPLIANCE INTENTS (H2 EXPANSION) ---

  - path: /api/miner/corporate-registry
    external_path: /api/miner/corporate-registry
    method: GET
    intents:
      - CORPORATE_REGISTRY_LOOKUP_GENERAL
    description: >-
      Looks up corporate registry records for a legal entity via GLEIF Global LEI Index
      and UK Companies House public registry fallback. Accepts structured parameters or
      natural-language questions (?question=/query=). Returns company legal name, LEI or
      company number, active status (status_active 1 or 0), jurisdiction, registered
      address, and official source URLs across 200+ jurisdictions worldwide.
    params:
      query:
        optional:
          - name: name
            type: string
            intents: ["*"]
            description: "Legal entity name to search (also accepted as company, entity, legal_name)"
          - name: company
            type: string
            intents: ["*"]
            description: "Alias for name"
          - name: jurisdiction
            type: string
            intents: ["*"]
            description: "ISO 3166-1 alpha-2 country code (e.g., US, GB, DE)"
          - name: question
            type: string
            intents: ["*"]
            description: "Corporate registry inquiry"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim evaluation prompt string"

  - path: /api/miner/sanctions-screen
    external_path: /api/miner/sanctions-screen
    method: GET
    intents:
      - SANCTIONS_SCREENING_MATCH_GENERAL
    description: >-
      Screens a person or entity name against the US Treasury OFAC SDN
      (Specially Designated Nationals) sanctions list with fuzzy matching
      against primary names and known aliases. Returns match details,
      similarity scores, and associated sanctions programs. List is cached
      and refreshed every 6 hours from official OFAC data.
    params:
      query:
        optional:
          - name: name
            type: string
            intents: ["*"]
            description: "Person or entity name to screen (required)"
          - name: question
            type: string
            intents: ["*"]
            description: "Sanctions screening inquiry"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim evaluation prompt string"

  - path: /api/miner/regulatory-filing
    external_path: /api/miner/regulatory-filing
    method: GET
    intents:
      - REGULATORY_FILING_MONITOR_GENERAL
    description: >-
      Monitors regulatory filing status for legal entities using authoritative keyless
      sources: SEC EDGAR Submissions API (CIK-resolved company filings for 10-K, 10-Q,
      8-K) with EFTS full-text search fallback; US Federal Register API for agency notices
      and rules; and GLEIF for LEI registration status and renewal dates. Supports both
      structured parameters and natural-language questions (?question=/query=).
    params:
      query:
        optional:
          - name: entity
            type: string
            intents: ["*"]
            description: "Legal entity or company name to check filings for"
          - name: company
            type: string
            intents: ["*"]
            description: "Alias for entity"
          - name: period
            type: string
            intents: ["*"]
            description: "Filing period filter (e.g., 2026, Q3 2026)"
          - name: question
            type: string
            intents: ["*"]
            description: "Regulatory filing inquiry"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim evaluation prompt string"
          - name: filter[entity.legalName]
            type: string
            intents: ["*"]
            description: "GLEIF standard filter for entity legal name"
          - name: filter[entity.lei]
            type: string
            intents: ["*"]
            description: "GLEIF standard filter for entity LEI"

  - path: /api/miner/contract-obligation
    external_path: /api/miner/contract-obligation
    method: GET
    intents:
      - CONTRACT_OBLIGATION_AUDIT_GENERAL
    description: >-
      Audits contractual and statutory obligations across standard procurement, construction,
      and commercial real estate regimes (MahaRERA delay interest under Section 18(1), FIDIC Sub-Clause 20.1
      EOT time-bars & Sub-Clause 8.7 LDs, MEP turnkey retention releases, MSMED Act 2006 statutory
      overrides of pay-when-paid clauses, commercial lease CAM caps, and civil works price escalation).
      Accepts canonical parameters or verbatim natural-language audit prompts (?question=...).
    params:
      query:
        optional:
          - name: question
            type: string
            intents: ["*"]
            description: "Full verbatim contract obligation audit query"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim evaluation prompt string"
          - name: contract
            type: string
            intents: ["*"]
            description: "Contract identifier or reference"
          - name: clause
            type: string
            intents: ["*"]
            description: "Clause or sub-clause under audit"
  - path: /api/miner/mining-intelligence
    external_path: /api/miner/mining-intelligence
    method: GET
    intents:
      - MINING_INTELLIGENCE_GENERAL
    description: >-
      Deep historical mining & geological intelligence across GSQ, GSWA, USGS, CGS, GSI, and NRCan
      open survey records. Returns verified deposit metrics, jurisdiction, provenance, and confidence.
      Accepts mine name, site, or natural-language query (?question=...).
    params:
      query:
        optional:
          - name: site
            type: string
            intents: ["*"]
            description: "Mine name, goldfield, or deposit identifier"
          - name: mine
            type: string
            intents: ["*"]
            description: "Alias for site"
          - name: question
            type: string
            intents: ["*"]
            description: "Full verbatim mining intelligence query"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim evaluation prompt string"

  - path: /api/miner/grid-power-price
    external_path: /api/miner/grid-power-price
    method: GET
    intents:
      - GRID_POWER_PRICE_GENERAL
    description: >-
      Provides authoritative wholesale grid power pricing, Locational Marginal Pricing (LMP),
      and settlement point prices for CAISO (NP15, SP15, ZP26) and ERCOT (North, South, West, Houston).
      Accepts canonical parameters (hub, iso, market) or natural-language query (?question=...).
    params:
      query:
        optional:
          - name: hub
            type: string
            intents: ["*"]
            description: "Grid pricing hub or settlement node (e.g. NP15, SP15, ERCOT North, Houston)"
          - name: node_or_zone
            type: string
            intents: ["*"]
            description: "Settlement node or ISO pricing zone (e.g. NP15, SP15, Houston)"
          - name: interval_start
            type: string
            intents: ["*"]
            description: "ISO-8601 UTC timestamp or interval starting time"
          - name: iso
            type: string
            intents: ["*"]
            description: "Independent System Operator or RTO (CAISO, ERCOT, NYISO)"
          - name: market
            type: string
            intents: ["*"]
            description: "Market interval: RTM (Real-Time Market) or DAM (Day-Ahead Market)"
          - name: question
            type: string
            intents: ["*"]
            description: "Full verbatim power price query string"

  - path: /api/miner/web-search
    external_path: /api/miner/web-search
    method: GET
    intents:
      - WEB_SEARCH_GENERAL
    description: >-
      Authoritative, multi-source keyless web intelligence across Wikipedia REST API, Google News RSS,
      and DuckDuckGo Instant Answers. Returns structured answer, source URLs, and concise <=80-char brief.
    params:
      query:
        optional:
          - name: query
            type: string
            intents: ["*"]
            description: "What to search for"
          - name: question
            type: string
            intents: ["*"]
            description: "Natural-language query string"
          - name: q
            type: string
            intents: ["*"]
            description: "Compact query alias"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim query prompt string"

  - path: /api/miner/onchain-tx
    external_path: /api/miner/onchain-tx
    method: GET
    intents:
      - ONCHAIN_TX_LOOKUP_GENERAL
    description: >-
      Source-attributed EVM and Solana transaction verification directly via archive/mainnet JSON-RPC nodes.
      Resolves execution status (confirmed, reverted, pending, not_found), block/slot number, from, to, gas used, and native value.
    params:
      query:
        optional:
          - name: tx_hash
            type: string
            intents: ["*"]
            description: "64-character EVM tx hash or Solana Base58 signature"
          - name: hash
            type: string
            intents: ["*"]
            description: "Alias for tx_hash"
          - name: chain
            type: string
            intents: ["*"]
            description: "Target chain (ethereum, sepolia, base, arbitrum, optimism, polygon, solana, solana-devnet)"
          - name: question
            type: string
            intents: ["*"]
            description: "Query containing transaction hash or signature"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim query prompt string"

  - path: /api/miner/token-supply
    external_path: /api/miner/token-supply
    method: GET
    intents:
      - TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL
    description: >-
      Deterministic ERC-20 and Solana SPL token total supply and decimals verification directly via multi-chain JSON-RPC.
    params:
      query:
        optional:
          - name: token_address
            type: string
            intents: ["*"]
            description: "ERC-20 contract address or Solana SPL mint address"
          - name: token
            type: string
            intents: ["*"]
            description: "Target token contract/mint address or symbol with chain"
          - name: address
            type: string
            intents: ["*"]
            description: "Contract or mint address alias"
          - name: chain
            type: string
            intents: ["*"]
            description: "Target chain (ethereum, sepolia, base, arbitrum, optimism, polygon, solana)"
          - name: question
            type: string
            intents: ["*"]
            description: "Natural language query containing token address or mint"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim query prompt string"

  - path: /api/miner/wallet-balance
    external_path: /api/miner/wallet-balance
    method: GET
    intents:
      - WALLET_BALANCE_CHECK_GENERAL
    description: >-
      Deterministic native and token wallet balance verification across EVM chains and Solana (native SOL + SPL tokens) via JSON-RPC.
    params:
      query:
        optional:
          - name: wallet_address
            type: string
            intents: ["*"]
            description: "Target EVM 0x address or Solana Base58 wallet pubkey"
          - name: address
            type: string
            intents: ["*"]
            description: "Target EVM or Solana account address"
          - name: token
            type: string
            intents: ["*"]
            description: "Optional token symbol (e.g. USDC) or ERC-20 / SPL mint address"
          - name: token_address
            type: string
            intents: ["*"]
            description: "Optional ERC-20 contract or SPL mint address for token balance"
          - name: chain
            type: string
            intents: ["*"]
            description: "Target chain (ethereum, sepolia, base, arbitrum, optimism, polygon, solana, solana-devnet)"
          - name: question
            type: string
            intents: ["*"]
            description: "Query containing wallet address"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim query prompt string"

  - path: /api/miner/research-query
    external_path: /api/miner/research-query
    method: GET
    intents:
      - RESEARCH_QUERY_GENERAL
    description: >-
      Deep analytical research query synthesis with multi-source attribution and key findings.
    params:
      query:
        optional:
          - name: query
            type: string
            intents: ["*"]
            description: "Research topic or query"
          - name: question
            type: string
            intents: ["*"]
            description: "Natural language research question"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim query prompt string"

  - path: /api/miner/liquidity-depth
    external_path: /api/miner/liquidity-depth
    method: GET
    intents:
      - LIQUIDITY_DEPTH_VERIFY_GENERAL
    description: >-
      Verifies on-chain DEX liquidity depth, bid-ask spreads, and slippage for treasury operations.
      Dual-mode: accepts structured parameters (pair, chain, pool_address, depth_pct, notional_usd) or verbatim question string (?question=...).
    params:
      query:
        optional:
          - name: pair
            type: string
            intents: ["*"]
            description: "Trading pair symbol, e.g. ETH/USDC, WBTC/USDC"
          - name: chain
            type: string
            intents: ["*"]
            description: "Blockchain network: ethereum, base, arbitrum, polygon"
          - name: pool_address
            type: string
            intents: ["*"]
            description: "DEX liquidity pool contract address"
          - name: pool
            type: string
            intents: ["*"]
            description: "Alias for pool_address"
          - name: depth_pct
            type: number
            intents: ["*"]
            description: "Depth percentage boundary from mid-price (e.g. 2.0 for +/-2%)"
          - name: notional_usd
            type: number
            intents: ["*"]
            description: "Target transaction notional in USD to model price impact"
          - name: question
            type: string
            intents: ["*"]
            description: "Natural language query describing liquidity verification requirement"
          - name: query
            type: string
            intents: ["*"]
            description: "Query string alias for question"
          - name: prompt
            type: string
            intents: ["*"]
            description: "Verbatim query prompt string"

  - path: /api/miner/b2b-identity
    external_path: /api/miner/b2b-identity
    method: GET
    intents:
      - B2B_IDENTITY_ENRICHMENT_GENERAL
    description: >-
      Enriches a business domain, work email, brand, or legal name with verified GLEIF LEI, entity status, HQ address, jurisdiction, and live RDAP/DNS MX domain validity.
    params:
      query:
        optional:
          - name: domain
            type: string
            intents: ["*"]
