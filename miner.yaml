version: "1"
kind: miner
id: 5185
slug: praman-compliance-miner
protocol: generic
name: Praman Desk Compliance & Procurement Auditor
description: >-
  Autonomous compliance auditor, 3-way invoice vs ledger reconciliation,
  procurement purchase order verification, statutory entity checks via GLEIF,
  cryptographic SHA-256 e-Invoice provenance verification, global corporate
  registry lookups across 200+ jurisdictions, US Treasury OFAC sanctions
  screening with fuzzy alias matching, and SEC EDGAR / Federal Register
  regulatory filing monitoring. Deterministic ground-truth guarantees without API keys.
base_url: https://praman-desk.vercel.app

auth:
  type: none

endpoints:
  - path: /api/miner/po-verify
    external_path: /api/miner/po-verify
    method: GET
    intents:
      - PURCHASE_ORDER_VERIFY_GENERAL
    description: >-
      Verifies purchase order arithmetic and line totals. Checks line_total = quantity * unit_price,
      sum of lines = subtotal, and subtotal + tax + shipping = grand_total.
      Accepts canonical parameters (po_number, vendor, items) or verbatim question string (?question=...).
    params:
      query:
        optional:
          - name: po_number
            type: string
            intents: ["*"]
            description: "Purchase order identifier"
          - name: vendor
            type: string
            intents: ["*"]
            description: "Vendor entity name"
          - name: question
            type: string
            intents: ["*"]
            description: "Full verbatim purchase order text or audit query"
          - name: query
            type: string
            intents: ["*"]
            description: "Legacy query alias for question"

  - path: /api/miner/invoice-reconcile
    external_path: /api/miner/invoice-reconcile
    method: GET
    intents:
      - INVOICE_LEDGER_RECONCILE_GENERAL
    description: >-
      Performs 3-way invoice vs ledger reconciliation. Identifies mathematical discrepancies,
      tax rate mismatches, unit price variances, and currency conversion adjustments.
      Returns boolean reconciled status, numerical discrepancy amount, and detailed findings.
    params:
      query:
        optional:
          - name: invoice
            type: string
            intents: ["*"]
            description: "Invoice identifier, amount, or payload"
          - name: ledger
            type: string
            intents: ["*"]
            description: "ERP ledger entry or general ledger reference"
          - name: question
            type: string
            intents: ["*"]
            description: "Verbatim reconciliation problem text"

  - path: /api/miner/vendor-verify
    external_path: /api/miner/vendor-verify
    method: GET
    intents:
      - VENDOR_VERIFY_GENERAL
    description: >-
      Verifies vendor corporate existence, active statutory status, and LEI registration
      against the Global Legal Entity Identifier Foundation (GLEIF) primary registry.
      Returns boolean valid status, legal name, jurisdiction, and official registrar link.
    params:
      query:
        optional:
          - name: vendor
            type: string
            intents: ["*"]
            description: "Legal company name or business trading name"
          - name: vat_number
            type: string
            intents: ["*"]
            description: "VAT, EIN, GSTIN, or LEI tax identifier"
          - name: lei
            type: string
            intents: ["*"]
            description: "20-character ISO 17442 Legal Entity Identifier"
          - name: question
            type: string
            intents: ["*"]
            description: "Vendor inquiry question"

  - path: /api/miner/doc-authenticity
    external_path: /api/miner/doc-authenticity
    method: GET
    intents:
      - DOCUMENT_AUTHENTICITY_GENERAL
    description: >-
      Verifies document provenance, e-Invoice canonical representation, and SHA-256 cryptographic digest.
      Confirms integrity of digital invoices, bills of lading, and procurement receipts.
    params:
      query:
        optional:
          - name: document
            type: string
            intents: ["*"]
            description: "Document body, e-invoice text, or SHA-256 hash"
          - name: hash
            type: string
            intents: ["*"]
            description: "Expected SHA-256 cryptographic digest"
          - name: question
            type: string
            intents: ["*"]
            description: "Document verification inquiry"

  # --- NEW COMPLIANCE INTENTS (H2 EXPANSION) ---

  - path: /api/miner/corporate-registry
    external_path: /api/miner/corporate-registry
    method: GET
    intents:
      - CORPORATE_REGISTRY_LOOKUP_GENERAL
    description: >-
      Looks up corporate registry records for a legal entity via the GLEIF Global LEI Index.
      Returns company legal name, LEI, active status (status_active 1 or 0), jurisdiction,
      registered and headquarters address, entity category, legal form, creation date,
      and last update. Supports 200+ jurisdictions worldwide.
    params:
      query:
        optional:
          - name: name
            type: string
            intents: ["*"]
            description: "Legal entity name to search (also accepted as company, entity, legal_name)"
          - name: company
            type: string
            intents: ["*"]
            description: "Alias for name"
          - name: jurisdiction
            type: string
            intents: ["*"]
            description: "ISO 3166-1 alpha-2 country code (e.g., US, GB, DE)"
          - name: question
            type: string
            intents: ["*"]
            description: "Corporate registry inquiry"

  - path: /api/miner/sanctions-screen
    external_path: /api/miner/sanctions-screen
    method: GET
    intents:
      - SANCTIONS_SCREENING_MATCH_GENERAL
    description: >-
      Screens a person or entity name against the US Treasury OFAC SDN
      (Specially Designated Nationals) sanctions list with fuzzy matching
      against primary names and known aliases. Returns match details,
      similarity scores, and associated sanctions programs. List is cached
      and refreshed every 6 hours from official OFAC data.
    params:
      query:
        optional:
          - name: name
            type: string
            intents: ["*"]
            description: "Person or entity name to screen (required)"
          - name: question
            type: string
            intents: ["*"]
            description: "Sanctions screening inquiry"

  - path: /api/miner/regulatory-filing
    external_path: /api/miner/regulatory-filing
    method: GET
    intents:
      - REGULATORY_FILING_MONITOR_GENERAL
    description: >-
      Monitors regulatory filing status for legal entities using three
      authoritative keyless sources: SEC EDGAR full-text search for 10-K,
      10-Q, 8-K filings; US Federal Register for regulatory notices and
      rules; and GLEIF for LEI registration status and renewal dates.
    params:
      query:
        optional:
          - name: entity
            type: string
            intents: ["*"]
            description: "Legal entity or company name to check filings for"
          - name: company
            type: string
            intents: ["*"]
            description: "Alias for entity"
          - name: period
            type: string
            intents: ["*"]
            description: "Filing period filter (e.g., 2026, Q3 2026)"
          - name: question
            type: string
            intents: ["*"]
            description: "Regulatory filing inquiry"

semantics:
  supported_intents:
    - PURCHASE_ORDER_VERIFY_GENERAL
    - INVOICE_LEDGER_RECONCILE_GENERAL
    - VENDOR_VERIFY_GENERAL
    - DOCUMENT_AUTHENTICITY_GENERAL
    - CORPORATE_REGISTRY_LOOKUP_GENERAL
    - SANCTIONS_SCREENING_MATCH_GENERAL
    - REGULATORY_FILING_MONITOR_GENERAL

docs:
  repository: https://github.com/VishAlgoDev/praman-desk

rate_limit_per_sec: 20
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30
